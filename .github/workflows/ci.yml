name: ETL CI

on:
  push:
  pull_request:

jobs:
  test-and-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run sample pipeline
        run: python -m src.run_pipeline --sample

      - name: Upload sample run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-pipeline-reports
          if-no-files-found: warn
          path: |
            data/sample/output/pipeline_run_summary.json
            data/sample/output/data/processed/load_quality_report.csv
